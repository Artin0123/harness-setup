<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0f1117" />
<title>agy-metrics</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171a23'/%3E%3Cpath d='M5 18h5l3-8 5 12 3-6h6' fill='none' stroke='%236aa9ff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='16' r='2.2' fill='%233ddc97'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #262b38; --text: #e6e9f0;
    --muted: #9aa3b8; --accent: #6aa9ff; --green: #3ddc97; --yellow: #f5b942; --red: #ff6b6b;
  }
  * {
    box-sizing: border-box;
    scrollbar-width: thin;
    scrollbar-color: #2e3547 transparent;
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #2e3547; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: #434d66; background-clip: content-box; }

  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  aside { width: 340px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  .search-box { padding: 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .search-box input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-size: 14px; }
  .search-box input:focus { border-color: var(--accent); }
  .filter-tabs { display: flex; gap: 6px; }
  .tab { flex: 1; padding: 6px 0; text-align: center; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; font-size: 14px; }
  .tab.active { background: rgba(106,169,255,0.16); border-color: rgba(106,169,255,0.5); color: var(--text); font-weight: 600; }

  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conv-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; }
  .conv-item:hover { background: rgba(255,255,255,0.04); }
  .conv-item.active { background: rgba(106,169,255,0.12); border-color: rgba(106,169,255,0.4); }
  .conv-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { font-size: 14px; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 14px; font-weight: 600; }
  .tag-proj { background: rgba(106,169,255,0.16); color: #8ec0ff; }
  .tag-cli { background: rgba(167,139,250,0.18); color: #c4b5fd; }

  main { flex: 1; min-width: 0; overflow: hidden; padding: 22px 26px; display: flex; flex-direction: column; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
  .header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; }
  .header code { color: var(--accent); font-size: 14px; }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-menu { display: none; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer; }
  .btn-menu:hover { border-color: var(--accent); }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 20; }
  .backdrop.open { display: block; }
  .btn-rc { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--accent); font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn-rc:hover { border-color: var(--accent); background: rgba(106,169,255,0.12); }

  .cards { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; flex-shrink: 0; }
  .card { min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 16px; line-height: 1.45; white-space: nowrap; }
  .kv-k { color: var(--muted); }
  .kv-v { color: var(--text); font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; }
  .kv-head .kv-k { color: var(--text); font-weight: 600; }
  .kv-head .kv-v { font-size: 16px; font-weight: 700; }
  .num2 { display: inline-block; min-width: 2ch; text-align: right; }
  .ok { color: var(--green); } .warn { color: var(--yellow); } .bad { color: var(--red); }

  .table-box { flex: 1; min-height: 0; width: 100%; overflow-x: auto; overflow-y: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; }
  .table-inner { min-width: 960px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .table-head { flex-shrink: 0; overflow-y: hidden; scrollbar-gutter: stable; border-bottom: 1px solid var(--border); }
  .table-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; font-variant-numeric: tabular-nums; }
  th, td { padding: 11px 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--muted); font-weight: 600; font-size: 14px; }
  td { border-bottom: 1px solid var(--border); }
  col:nth-child(1) { width: 6%; }
  col:nth-child(2) { width: 10%; }
  col:nth-child(3) { width: 17%; }
  col:nth-child(4) { width: 12%; }
  col:nth-child(5) { width: 22%; }
  col:nth-child(6) { width: 19%; }
  col:nth-child(7) { width: 14%; }
  tbody tr:last-child td { border-bottom: none; }
  @media (max-width: 1180px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    body { height: auto; min-height: 100vh; overflow-y: auto; }
    .btn-menu { display: inline-block; }
    aside { position: fixed; top: 0; left: 0; bottom: 0; width: 320px; max-width: 85vw; z-index: 30; transform: translateX(-100%); transition: transform .2s ease; }
    aside.open { transform: translateX(0); }
    main { padding: 16px; overflow: visible; }
    .table-box { flex: none; max-height: 460px; }
  }
  @media (max-width: 540px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="backdrop" class="backdrop" onclick="toggleMenu(false)"></div>
<aside id="sidebar">
  <div class="search-box">
    <input id="q" type="search" placeholder="搜尋 ID、標題或專案名稱..." />
    <div class="filter-tabs">
      <button class="tab active" data-g="all">全部</button>
      <button class="tab" data-g="project">專案</button>
      <button class="tab" data-g="general">一般</button>
    </div>
  </div>
  <div id="list" class="conv-list"></div>
</aside>
<main id="detail">
  <div style="color:var(--muted)">載入對話資料中...</div>
</main>
<script>
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmtTok = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n ?? 0);
const fmtSec = s => s == null ? '—' : s.toFixed(2)+'s';
let selectedId = new URLSearchParams(location.search).get('id') || '';
let currentQuery = '';
let currentGroup = 'all';
let lastMtimeMs = 0;

async function fetchList() {
  const res = await fetch(`/api/conversations?q=${encodeURIComponent(currentQuery)}&group=${encodeURIComponent(currentGroup)}`);
  const items = await res.json();
  if (!selectedId && items.length) selectedId = items[0].id;
  const listEl = document.getElementById('list');
  listEl.innerHTML = items.map(it => {
    const tagCls = it.badgeKind === 'proj' ? 'tag-proj' : 'tag-cli';
    const tagHtml = it.badgeLabel ? `<span class="tag ${tagCls}">${esc(it.badgeLabel)}</span>` : '<span></span>';
    return `<div class="conv-item ${it.id===selectedId?'active':''}" data-id="${esc(it.id)}">
      <div class="conv-title">${esc(it.title)}</div>
      <div class="conv-meta">
        ${tagHtml}
        <span>${esc(it.id.slice(0,8))}</span>
      </div>
    </div>`;
  }).join('');
  for (const el of listEl.querySelectorAll('.conv-item')) {
    el.onclick = () => { selectedId = el.dataset.id; toggleMenu(false); fetchList(); fetchDetail(); };
  }
}

function fmtAge(ms) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  const w2 = n => `<span class="num2">${n}</span>`;
  if (s < 60) return `${w2(s)} 秒前`;
  if (s < 3600) return `${Math.floor(s/60)} 分 ${w2(s%60)} 秒前`;
  if (s < 86400) return `${Math.floor(s/3600)} 時 ${w2(Math.floor((s%3600)/60))} 分前`;
  return `${Math.floor(s/86400)} 天 ${w2(Math.floor((s%86400)/3600))} 時前`;
}

async function fetchDetail() {
  if (!selectedId) return;
  const res = await fetch('/api/metrics?id=' + encodeURIComponent(selectedId));
  const d = await res.json();
  const detail = document.getElementById('detail');
  if (!d || !d.latest) {
    detail.innerHTML = `<div class="header"><h1><span class="live-dot"></span> 尚無模型請求紀錄</h1><code>${esc(selectedId)}</code></div>`;
    return;
  }
  lastMtimeMs = d.mtimeMs;
  const l = d.latest, t = d.totals;
  const ctxPct = l.maxContextTokens ? (l.contextTokens / l.maxContextTokens * 100) : 0;
  const ctxCls = ctxPct >= 80 ? 'bad' : ctxPct >= 60 ? 'warn' : 'ok';
  const cachePct = t.totalIn ? (t.cachedIn / t.totalIn * 100) : 0;

  detail.innerHTML = `
    <div class="header">
      <div class="header-left">
        <button class="btn-menu" onclick="toggleMenu()" aria-label="開啟對話清單">☰</button>
        <h1><span class="live-dot" title="SSE 即時監聽中"></span> 對話遙測</h1>
        <code>${esc(d.id)}</code>
      </div>
      <a class="btn-rc" href="https://antigravity.google.com/remote?path=%2Fview%2Fremote-control" target="_blank" rel="noopener">前往對話頁面</a>
    </div>
    <div class="cards">
      <div class="card">
        <div class="kv kv-head"><span class="kv-k">上下文</span><span class="kv-v ${ctxCls}">${ctxPct.toFixed(1)}%</span></div>
        <div class="kv"><span class="kv-k">已用</span><span class="kv-v">${fmtTok(l.contextTokens)}</span></div>
        <div class="kv"><span class="kv-k">上限</span><span class="kv-v">${fmtTok(l.maxContextTokens)}</span></div>
        <div class="kv"><span class="kv-k">模型</span><span class="kv-v" title="${esc(l.model || '—')}">${esc(l.model || '—')}</span></div>
      </div>
      <div class="card">
        <div class="kv kv-head"><span class="kv-k">總輸入</span><span class="kv-v">${fmtTok(t.totalIn)}</span></div>
        <div class="kv"><span class="kv-k">快取</span><span class="kv-v">${fmtTok(t.cachedIn)}</span></div>
        <div class="kv"><span class="kv-k">未快取</span><span class="kv-v">${fmtTok(t.uncachedIn)}</span></div>
        <div class="kv"><span class="kv-k">命中率</span><span class="kv-v">${cachePct.toFixed(1)}%</span></div>
      </div>
      <div class="card">
        <div class="kv kv-head"><span class="kv-k">總輸出</span><span class="kv-v">${fmtTok(t.totalOut)}</span></div>
        <div class="kv"><span class="kv-k">思考</span><span class="kv-v">${fmtTok(t.think)}</span></div>
        <div class="kv"><span class="kv-k">回覆</span><span class="kv-v">${fmtTok(t.reply)}</span></div>
      </div>
      <div class="card">
        <div class="kv kv-head"><span class="kv-k">上次請求</span><span class="kv-v" id="age">${fmtAge(d.mtimeMs)}</span></div>
        <div class="kv"><span class="kv-k">總共請求</span><span class="kv-v">${t.requests} 次</span></div>
      </div>
    </div>
    <div class="table-box">
      <div class="table-inner">
        <div class="table-head">
          <table>
            <colgroup><col><col><col><col><col><col><col></colgroup>
            <thead><tr><th>輪次</th><th>請求數</th><th>TTFT / 總耗時</th><th>速度</th><th>輸入 (快取 + 未快取)</th><th>輸出 (思考 + 回覆)</th><th>執行時間</th></tr></thead>
          </table>
        </div>
        <div class="table-body">
          <table>
            <colgroup><col><col><col><col><col><col><col></colgroup>
            <tbody>
              ${d.turns.map(turn => `<tr>
                <td>${turn.turnNo}</td>
                <td>${turn.requestCount}</td>
                <td>${fmtSec(turn.ttftSum)} / ${fmtSec(turn.durSum)}</td>
                <td>${turn.tps ? turn.tps.toFixed(1)+' tok/s' : '—'}</td>
                <td>${fmtTok(turn.totalIn)} (${fmtTok(turn.cachedIn)} + ${fmtTok(turn.uncachedIn)})</td>
                <td>${fmtTok(turn.totalOut)} (${fmtTok(turn.think)} + ${fmtTok(turn.reply)})</td>
                <td>${esc(turn.time || '—')}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

document.getElementById('q').addEventListener('input', e => {
  currentQuery = e.target.value;
  fetchList();
});
for (const btn of document.querySelectorAll('.tab')) {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGroup = btn.dataset.g;
    fetchList();
  };
}

function toggleMenu(force) {
  const s = document.getElementById('sidebar');
  const b = document.getElementById('backdrop');
  const open = typeof force === 'boolean' ? force : !s.classList.contains('open');
  s.classList.toggle('open', open);
  b.classList.toggle('open', open);
}

fetchList().then(fetchDetail);
const es = new EventSource('/api/events');
es.addEventListener('update', () => { fetchList(); fetchDetail(); });
setInterval(() => {
  const el = document.getElementById('age');
  if (el && lastMtimeMs) el.innerHTML = fmtAge(lastMtimeMs);
}, 1000);
</script>
</body>
</html>
